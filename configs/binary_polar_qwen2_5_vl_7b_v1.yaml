protocol_version: binary_polar_qwen2_5_vl_7b_v1

gates:
  label_representation: /data/dataset/dynamic_mllm/binary_polar_v1/binary_polar_label_geometry_audit_v1.json
  executor_reproduction: outputs/binary_polar/preflight/executor_preflight_v1.json
  frozen_data_manifest: /data/dataset/dynamic_mllm/binary_polar_v1/binary_polar_label_audit_v1.json

base_model:
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
  # Executor/label parity must pass before this configuration is trainable.
  attention_implementation: sdpa
  precision: bfloat16

policy:
  action_semantics: layer_local_visual_token_presence
  num_layers: 28
  visual_off: compact_text_control_rows_and_bypass_visual_rows
  visual_on: native_full_sequence_decoder_layer
  primary_representation: direct_binary_mask
  structured_baseline: canonical_maximal_run_binary

data:
  source: /home/hyemin/data/dataset/dynamic_mllm/mcts_v2
  # Built by tools/prepare_binary_polar_data.py after the label audit gate.
  manifest: /data/dataset/dynamic_mllm/binary_polar_v1/binary_polar_labels_v1.jsonl
  max_valid_routes_per_sample: 50
  route_cap_seed: 20260809
  split_seed: 20260809
  train_fraction: 0.75
  validation_fraction: 0.125
  test_fraction: 0.125
  max_question_tokens: 512
  no_success_record_policy: evaluation_only
  all_on_weight_when_shorter_valid_exists: 0.25

predictor:
  input: question_only
  embedding_model_id: Qwen/Qwen3-Embedding-0.6B
  embedding_revision: c54f2e6e80b2d7b7de06f51cec4959f6b3e03418
  embedding_model_path: /home/hyunjin/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-0.6B/snapshots/c54f2e6e80b2d7b7de06f51cec4959f6b3e03418
  frozen_embedding_model: true
  d_model: 256
  num_heads: 4
  num_layer_blocks: 2
  dropout: 0.1
  objective: observed_valid_mask_set_nll

training:
  # Values mirror the small end of POLAR's published tuning ranges. Training is
  # not authorized until executor and label gates pass.
  seed: 20260809
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  epochs: 10
  num_workers: 4
  gradient_clip_norm: 1.0

evaluation:
  top_k: 5
  primary_online_policy: top1
  report_by_benchmark_and_difficulty: true
  macro_average_cells: true
